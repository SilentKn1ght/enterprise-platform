name: Dev Environment Sleep Mode

on:
  schedule:
    - cron: "0 20 * * *"  
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  CLUSTER: enterprise-platform-dev-cluster
  SERVICE: enterprise-platform-dev-service
  DB: enterprise-platform-db
  TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

jobs:
  sleep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------
      # 1️⃣ SCALE ECS TO ZERO
      # -----------------------------
      - name: Scale ECS to Zero
        run: |
          echo "Checking ECS desired count..."

          DESIRED=$(aws ecs describe-services \
            --cluster $CLUSTER \
            --services $SERVICE \
            --query "services[0].desiredCount" \
            --output text)

          echo "Current desired count: $DESIRED"

          if [ "$DESIRED" -eq 0 ]; then
            echo "ECS already scaled down."
          else
            echo "Scaling ECS to 0..."
            aws ecs update-service \
              --cluster $CLUSTER \
              --service $SERVICE \
              --desired-count 0
          fi

      - name: Wait for ECS Tasks to Stop
        run: |
          echo "Waiting for ECS tasks to stop..."
          while true; do
            COUNT=$(aws ecs list-tasks \
              --cluster $CLUSTER \
              --query "length(taskArns)" \
              --output text)

            if [ "$COUNT" -eq 0 ]; then
              echo "All ECS tasks stopped."
              break
            fi

            echo "$COUNT task(s) still running..."
            sleep 15
          done

      # -----------------------------
      # 2️⃣ STOP RDS
      # -----------------------------
      - name: Stop RDS if Running
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier $DB \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text 2>/dev/null)

          echo "Current RDS status: $STATUS"

          if [ "$STATUS" = "available" ]; then
            echo "Stopping RDS..."
            aws rds stop-db-instance \
              --db-instance-identifier $DB
          elif [ "$STATUS" = "stopped" ]; then
            echo "RDS already stopped."
          else
            echo "RDS in state: $STATUS"
          fi

      - name: Wait for RDS to Stop
        run: |
          while true; do
            STATUS=$(aws rds describe-db-instances \
              --db-instance-identifier $DB \
              --query "DBInstances[0].DBInstanceStatus" \
              --output text)

            if [ "$STATUS" = "stopped" ]; then
              echo "RDS fully stopped."
              break
            fi

            echo "RDS status: $STATUS"
            sleep 20
          done

      # -----------------------------
      # 3️⃣ DESTROY NAT GATEWAY & EIP
      # -----------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Destroy NAT Gateway
        working-directory: terraform
        timeout-minutes: 10
        run: |
          echo "Destroying NAT Gateway..."
          terraform destroy \
            -target=module.networking.aws_nat_gateway.main \
            -auto-approve \
            -input=false \
            -no-color || true
          echo "NAT Gateway destruction initiated"

      - name: Verify NAT Gateway Deletion
        run: |
          echo "Verifying NAT Gateway deletion..."
          MAX_WAIT=300  # 5 minutes
          INTERVAL=10
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            NAT_COUNT=$(aws ec2 describe-nat-gateways \
              --filter "Name=tag:Name,Values=enterprise-platform-dev-nat" \
              --region ${{ env.AWS_REGION }} \
              --query "length(NatGateways[?State!='deleted'])" \
              --output text 2>/dev/null || echo "0")
            
            if [ "$NAT_COUNT" -eq 0 ]; then
              echo "✅ NAT Gateway fully deleted"
              break
            fi
            
            echo "Waiting for NAT deletion... ($NAT_COUNT still deleting, waited ${ELAPSED}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          if [ "$NAT_COUNT" -gt 0 ]; then
            echo "⚠️ NAT Gateway still exists, forcing cleanup..."
            NAT_IDS=$(aws ec2 describe-nat-gateways \
              --filter "Name=tag:Name,Values=enterprise-platform-dev-nat" \
              --region ${{ env.AWS_REGION }} \
              --query "NatGateways[?State!='deleted'].NatGatewayId" \
              --output text)
            
            for NAT_ID in $NAT_IDS; do
              echo "Force deleting NAT: $NAT_ID"
              aws ec2 delete-nat-gateway --nat-gateway-id "$NAT_ID" --region ${{ env.AWS_REGION }} || true
            done
          fi

      - name: Release Orphaned Elastic IPs
        run: |
          echo "Cleaning up orphaned Elastic IPs..."
          ORPHANED_EIPS=$(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=enterprise-platform-dev-nat-eip" \
            --region ${{ env.AWS_REGION }} \
            --query "Addresses[?AssociationId==null].AllocationId" \
            --output text)
          
          if [ ! -z "$ORPHANED_EIPS" ]; then
            for EIP in $ORPHANED_EIPS; do
              echo "Releasing EIP: $EIP"
              aws ec2 release-address --allocation-id "$EIP" --region ${{ env.AWS_REGION }} && \
              echo "✅ Released: $EIP" || echo "⚠️ Could not release: $EIP"
            done
          else
            echo "No orphaned EIPs to clean up"
          fi

      # Try to destroy EIP via Terraform if not released
      - name: Destroy EIP (via Terraform)
        working-directory: terraform
        timeout-minutes: 5
        run: |
          echo "Attempting to destroy EIP via Terraform..."
          terraform destroy \
            -target=module.networking.aws_eip.nat \
            -auto-approve \
            -input=false \
            -no-color || true

      # -----------------------------
      # 4️⃣ DESTROY ALB
      # -----------------------------
      - name: Destroy ALB
        working-directory: terraform
        timeout-minutes: 10
        run: |
          echo "=== Destroying ALB and Target Group ==="
          
          # First, try Terraform destroy
          echo "Step 1: Attempting terraform destroy..."
          if terraform destroy \
            -target=module.alb \
            -auto-approve \
            -input=false \
            -no-color 2>&1 | tee /tmp/alb-destroy.log; then
            echo "✅ Terraform destroy completed"
          else
            echo "⚠️ Terraform destroy had issues, checking logs..."
            cat /tmp/alb-destroy.log
          fi

      - name: Force Delete ALB if Terraform Failed
        run: |
          echo "=== Force ALB Deletion Check ==="
          
          # Check if ALB still exists
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --region ${{ env.AWS_REGION }} \
            --query "LoadBalancers[?LoadBalancerName=='enterprise-platform-alb'].LoadBalancerArn" \
            --output text 2>/dev/null || echo "")
          
          if [ ! -z "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            echo "⚠️ ALB still exists: $ALB_ARN"
            echo "Forcing deletion via AWS CLI..."
            
            # Get and delete target group first
            TG_ARN=$(aws elbv2 describe-target-groups \
              --region ${{ env.AWS_REGION }} \
              --query "TargetGroups[?TargetGroupName=='enterprise-platform-tg'].TargetGroupArn" \
              --output text 2>/dev/null || echo "")
            
            if [ ! -z "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
              echo "Deleting target group: $TG_ARN"
              aws elbv2 delete-target-group \
                --target-group-arn "$TG_ARN" \
                --region ${{ env.AWS_REGION }} 2>&1 || echo "Target group may have been deleted already"
              sleep 5
            fi
            
            # Delete ALB
            echo "Deleting load balancer: $ALB_ARN"
            aws elbv2 delete-load-balancer \
              --load-balancer-arn "$ALB_ARN" \
              --region ${{ env.AWS_REGION }} 2>&1 || {
              echo "❌ Failed to delete ALB via AWS CLI"
              exit 1
            }
            echo "✅ ALB deletion initiated via AWS CLI"
          else
            echo "✅ ALB not found (already deleted by Terraform)"
          fi

      - name: Verify ALB Deletion
        run: |
          echo "=== Verifying ALB Deletion ==="
          MAX_WAIT=180  # 3 minutes
          INTERVAL=10
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            ALB_COUNT=$(aws elbv2 describe-load-balancers \
              --region ${{ env.AWS_REGION }} \
              --query "length(LoadBalancers[?LoadBalancerName=='enterprise-platform-alb'])" \
              --output text 2>/dev/null || echo "0")
            
            if [ "$ALB_COUNT" -eq 0 ]; then
              echo "✅ ALB fully deleted and verified"
              exit 0
            fi
            
            echo "Waiting for ALB deletion... (waited ${ELAPSED}s, checking again in ${INTERVAL}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          echo "❌ ALB still exists after $MAX_WAIT seconds"
          echo "Failing workflow to alert about ALB deletion issue"
          exit 1

      - name: Final Cleanup Summary
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║   Dev Environment Sleep Complete       ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "✅ Components destroyed ("$0.158/hour saved):"
          echo "   - ECS: Scaled to 0 tasks"
          echo "   - RDS: Stopped (saves ~$0.076/hour)"
          echo "   - NAT Gateway: Destroyed (saves ~$0.042/hour)"
          echo "   - ALB: Destroyed (saves ~$0.023/hour)"
          echo ""
          echo "Infrastructure preserved (auto-recreated on wake):"
          echo "   - VPC, subnets, route tables"
          echo "   - Security groups"
          echo "   - ECR repository"
          echo "   - RDS data (7-day backup retention)"
          echo ""
          echo "Total estimated daily savings: ~$3.79 (12-hour sleep)"

      - name: Done
        run: echo "Dev environment is now sleeping."