name: Dev Environment Sleep Mode

on:
  schedule:
    - cron: "0 20 * * *"  
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  CLUSTER: enterprise-platform-dev-cluster
  SERVICE: enterprise-platform-dev-service
  DB: enterprise-platform-db

jobs:
  sleep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------
      # 1️⃣ SCALE ECS TO ZERO
      # -----------------------------
      - name: Scale ECS to Zero
        run: |
          echo "Checking ECS desired count..."

          DESIRED=$(aws ecs describe-services \
            --cluster $CLUSTER \
            --services $SERVICE \
            --query "services[0].desiredCount" \
            --output text)

          echo "Current desired count: $DESIRED"

          if [ "$DESIRED" -eq 0 ]; then
            echo "ECS already scaled down."
          else
            echo "Scaling ECS to 0..."
            aws ecs update-service \
              --cluster $CLUSTER \
              --service $SERVICE \
              --desired-count 0
          fi

      - name: Wait for ECS Tasks to Stop
        run: |
          echo "Waiting for ECS tasks to stop..."
          while true; do
            COUNT=$(aws ecs list-tasks \
              --cluster $CLUSTER \
              --query "length(taskArns)" \
              --output text)

            if [ "$COUNT" -eq 0 ]; then
              echo "All ECS tasks stopped."
              break
            fi

            echo "$COUNT task(s) still running..."
            sleep 15
          done

      # -----------------------------
      # 2️⃣ STOP RDS
      # -----------------------------
      - name: Stop RDS if Running
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier $DB \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text 2>/dev/null)

          echo "Current RDS status: $STATUS"

          if [ "$STATUS" = "available" ]; then
            echo "Stopping RDS..."
            aws rds stop-db-instance \
              --db-instance-identifier $DB
          elif [ "$STATUS" = "stopped" ]; then
            echo "RDS already stopped."
          else
            echo "RDS in state: $STATUS"
          fi

      - name: Wait for RDS to Stop
        run: |
          while true; do
            STATUS=$(aws rds describe-db-instances \
              --db-instance-identifier $DB \
              --query "DBInstances[0].DBInstanceStatus" \
              --output text)

            if [ "$STATUS" = "stopped" ]; then
              echo "RDS fully stopped."
              break
            fi

            echo "RDS status: $STATUS"
            sleep 20
          done

      # -----------------------------
      # 3️⃣ DESTROY NAT GATEWAY
      # -----------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Destroy NAT Gateway (If Exists)
        working-directory: terraform
        run: |
          terraform destroy \
            -target=module.networking.aws_nat_gateway.main \
            -auto-approve || true

      # -----------------------------
      # 4️⃣ DESTROY ALB (Optional)
      # -----------------------------
      - name: Destroy ALB (Optional)
        working-directory: terraform
        run: |
          terraform destroy \
            -target=module.alb \
            -auto-approve || true

      - name: Done
        run: echo "Dev environment is now sleeping."