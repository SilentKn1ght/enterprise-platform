name: Dev Environment Wake Mode

on:
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  CLUSTER: enterprise-platform-dev-cluster
  SERVICE: enterprise-platform-dev-service
  DB: enterprise-platform-db
  DESIRED_COUNT: 2
  TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

jobs:
  wake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------
      # 1️⃣ RECREATE NAT + ALB
      # -----------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Check NAT Gateway Status
        run: |
          echo "Checking NAT Gateway and EIP state..."
          
          # Check for orphaned EIPs
          ORPHANED_EIPS=$(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=enterprise-platform-dev-nat-eip" \
            --region ${{ env.AWS_REGION }} \
            --query "Addresses[?AssociationId==null].AllocationId" \
            --output text)
          
          if [ ! -z "$ORPHANED_EIPS" ]; then
            echo "Found orphaned EIP(s): $ORPHANED_EIPS"
            for EIP in $ORPHANED_EIPS; do
              echo "Releasing orphaned EIP: $EIP"
              aws ec2 release-address --allocation-id "$EIP" --region ${{ env.AWS_REGION }} || true
            done
          else
            echo "No orphaned EIPs found"
          fi
          
          # Check for incomplete NAT Gateway deletions
          INCOMPLETE_NATS=$(aws ec2 describe-nat-gateways \
            --filter "Name=tag:Name,Values=enterprise-platform-dev-nat" \
            --region ${{ env.AWS_REGION }} \
            --query "NatGateways[?State=='available' || State=='deleting' || State=='failed'].NatGatewayId" \
            --output text)
          
          if [ ! -z "$INCOMPLETE_NATS" ]; then
            echo "Warning: Found NAT Gateways in transition: $INCOMPLETE_NATS"
            echo "Waiting for them to stabilize (max 2 min)..."
            for i in {1..12}; do
              STATES=$(aws ec2 describe-nat-gateways \
                --nat-gateway-ids $INCOMPLETE_NATS \
                --region ${{ env.AWS_REGION }} \
                --query "NatGateways[].State" \
                --output text 2>/dev/null || echo "")
              if [ -z "$STATES" ]; then
                echo "NAT Gateway fully deleted"
                break
              fi
              echo "Current states: $STATES"
              sleep 10
            done
          fi

      - name: Recreate Infrastructure
        working-directory: terraform
        timeout-minutes: 15
        run: |
          set -e
          
          echo "Step 1: Planning infrastructure changes..."
          if ! terraform plan -out=tfplan 2>&1 | tee plan.log; then
            echo "❌ Terraform plan failed!"
            cat plan.log
            exit 1
          fi
          
          echo ""
          echo "Step 2: Applying infrastructure..."
          if ! terraform apply \
            -auto-approve \
            -input=false \
            -no-color \
            tfplan 2>&1 | tee apply.log; then
            echo "❌ Terraform apply failed!"
            echo "Log contents:"
            cat apply.log
            exit 1
          fi
          
          echo "✅ Infrastructure deployed successfully"

      - name: Verify ALB Creation
        run: |
          echo "=== Verifying ALB was recreated ==="
          MAX_WAIT=180  # 3 minutes
          INTERVAL=10
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            ALB_ARN=$(aws elbv2 describe-load-balancers \
              --region ${{ env.AWS_REGION }} \
              --query "LoadBalancers[?LoadBalancerName=='enterprise-platform-alb'].LoadBalancerArn" \
              --output text 2>/dev/null || echo "")
            
            if [ ! -z "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
              ALB_DNS=$(aws elbv2 describe-load-balancers \
                --load-balancer-arns "$ALB_ARN" \
                --region ${{ env.AWS_REGION }} \
                --query "LoadBalancers[0].DNSName" \
                --output text)
              echo "✅ ALB successfully recreated"
              echo "   DNS: $ALB_DNS"
              echo "   ARN: $ALB_ARN"
              exit 0
            fi
            
            echo "Waiting for ALB creation... (waited ${ELAPSED}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          echo "❌ ALB was not recreated within $MAX_WAIT seconds"
          exit 1
          
      - name: Verify NAT Gateway Creation
        run: |
          echo "Verifying NAT Gateway is operational..."
          MAX_WAIT=300  # 5 minutes
          INTERVAL=10
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            NAT_STATUS=$(aws ec2 describe-nat-gateways \
              --filter "Name=tag:Name,Values=enterprise-platform-dev-nat" \
              --region ${{ env.AWS_REGION }} \
              --query "NatGateways[0].State" \
              --output text 2>/dev/null || echo "NOT_FOUND")
            
            if [ "$NAT_STATUS" = "available" ]; then
              NAT_ID=$(aws ec2 describe-nat-gateways \
                --filter "Name=tag:Name,Values=enterprise-platform-dev-nat" \
                --region ${{ env.AWS_REGION }} \
                --query "NatGateways[0].NatGatewayId" \
                --output text)
              echo "✅ NAT Gateway is ready: $NAT_ID"
              exit 0
            fi
            
            echo "NAT Gateway status: $NAT_STATUS (waited ${ELAPSED}s/${MAX_WAIT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          echo "❌ NAT Gateway did not become available within $MAX_WAIT seconds"
          exit 1

      # -----------------------------
      # 2️⃣ START RDS
      # -----------------------------
      - name: Start RDS if Needed
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ env.DB }} \
            --region ${{ env.AWS_REGION }} \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text 2>/dev/null || echo "ERROR")

          echo "Current RDS status: $STATUS"

          if [ "$STATUS" = "stopped" ]; then
            echo "Starting RDS..."
            aws rds start-db-instance \
              --db-instance-identifier ${{ env.DB }} \
              --region ${{ env.AWS_REGION }}
          elif [ "$STATUS" = "available" ]; then
            echo "RDS already running."
          elif [ "$STATUS" = "ERROR" ]; then
            echo "Warning: Could not determine RDS status, will proceed anyway"
          else
            echo "RDS in state: $STATUS"
          fi

      - name: Wait for RDS to Become Available
        run: |
          MAX_WAIT=1800  # 30 minutes
          INTERVAL=20
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(aws rds describe-db-instances \
              --db-instance-identifier ${{ env.DB }} \
              --region ${{ env.AWS_REGION }} \
              --query "DBInstances[0].DBInstanceStatus" \
              --output text 2>/dev/null || echo "unknown")

            if [ "$STATUS" = "available" ]; then
              echo "RDS is ready."
              exit 0
            fi

            echo "RDS status: $STATUS (waited ${ELAPSED}s/${MAX_WAIT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          echo "ERROR: RDS did not become available within $MAX_WAIT seconds"
          exit 1

      # -----------------------------
      # 3️⃣ SCALE ECS BACK UP
      # -----------------------------
      - name: Scale ECS Back
        run: |
          DESIRED=$(aws ecs describe-services \
            --cluster ${{ env.CLUSTER }} \
            --services ${{ env.SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query "services[0].desiredCount" \
            --output text 2>/dev/null || echo "0")

          echo "Current ECS desired count: $DESIRED"

          if ! [[ "$DESIRED" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid desired count value: $DESIRED"
            exit 1
          fi

          if [ "$DESIRED" -eq "${{ env.DESIRED_COUNT }}" ]; then
            echo "ECS already scaled to ${{ env.DESIRED_COUNT }} tasks."
          else
            echo "Scaling ECS from $DESIRED to ${{ env.DESIRED_COUNT }} tasks..."
            aws ecs update-service \
              --cluster ${{ env.CLUSTER }} \
              --service ${{ env.SERVICE }} \
              --region ${{ env.AWS_REGION }} \
              --desired-count ${{ env.DESIRED_COUNT }}
            echo "ECS scaling requested successfully"
          fi

      - name: Wait for ECS Tasks to be Healthy
        run: |
          echo "Waiting for ECS tasks to become healthy..."
          MAX_WAIT=600  # 10 minutes
          INTERVAL=15
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            RUNNING=$(aws ecs describe-services \
              --cluster ${{ env.CLUSTER }} \
              --services ${{ env.SERVICE }} \
              --region ${{ env.AWS_REGION }} \
              --query "services[0].runningCount" \
              --output text 2>/dev/null || echo "0")
            
            DESIRED=$(aws ecs describe-services \
              --cluster ${{ env.CLUSTER }} \
              --services ${{ env.SERVICE }} \
              --region ${{ env.AWS_REGION }} \
              --query "services[0].desiredCount" \
              --output text 2>/dev/null || echo "0")
            
            if [ "$RUNNING" -eq "$DESIRED" ] && [ "$DESIRED" -eq "${{ env.DESIRED_COUNT }}" ]; then
              echo "✅ All $RUNNING ECS tasks are running"
              break
            fi
            
            echo "Progress: $RUNNING/$DESIRED tasks running (waited ${ELAPSED}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          if [ "$RUNNING" -ne "${{ env.DESIRED_COUNT }}" ]; then
            echo "⚠️ Not all tasks are running yet, but continuing..."
          fi

      - name: Verify ALB and Load Balancer
        run: |
          echo "Verifying ALB is ready..."
          ALB_NAME=$(aws elbv2 describe-load-balancers \
            --region ${{ env.AWS_REGION }} \
            --query "LoadBalancers[?LoadBalancerName=='enterprise-platform-alb'].LoadBalancerArn" \
            --output text 2>/dev/null || echo "")
          
          if [ ! -z "$ALB_NAME" ]; then
            ALB_DNS=$(aws elbv2 describe-load-balancers \
              --load-balancer-arns "$ALB_NAME" \
              --region ${{ env.AWS_REGION }} \
              --query "LoadBalancers[0].DNSName" \
              --output text)
            echo "✅ ALB is available at: http://$ALB_DNS"
          else
            echo "⚠️ ALB not found, may still be initializing"
          fi
          
          # Check target health
          TG_ARN=$(aws elbv2 describe-target-groups \
            --region ${{ env.AWS_REGION }} \
            --query "TargetGroups[?TargetGroupName=='enterprise-platform-tg'].TargetGroupArn" \
            --output text 2>/dev/null || echo "")
          
          if [ ! -z "$TG_ARN" ]; then
            HEALTHY=$(aws elbv2 describe-target-health \
              --target-group-arn "$TG_ARN" \
              --region ${{ env.AWS_REGION }} \
              --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" \
              --output text 2>/dev/null || echo "0")
            
            TOTAL=$(aws elbv2 describe-target-health \
              --target-group-arn "$TG_ARN" \
              --region ${{ env.AWS_REGION }} \
              --query "length(TargetHealthDescriptions)" \
              --output text 2>/dev/null || echo "0")
            
            echo "Target health: $HEALTHY/$TOTAL targets healthy"
          fi

      - name: Final Status Report
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║   Dev Environment Wake Complete        ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "✅ Infrastructure fully recreated:"
          echo "   - NAT Gateway: Ready (public internet access)"
          echo "   - ALB: Recreated (accessible at http://DNS)"
          echo "   - RDS: Started (database available)"
          echo "   - ECS: Scaling up ${{ env.DESIRED_COUNT }} tasks"
          echo ""
          echo "Ready for development:"
          echo "   1. Wait 2-3 minutes for ECS tasks to be healthy"
          echo "   2. Check CloudWatch logs at /ecs/enterprise-platform-dev"
          echo "   3. Verify ALB targets are healthy in AWS Console"
          echo ""
          echo "Automation will shut down this infrastructure at 20:00 UTC daily"
          echo "Estimated daily cost with 12-hour sleep cycle: ~\$2.83 USD"