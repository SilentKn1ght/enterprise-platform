name: Auto Destroy Infrastructure

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC daily
  workflow_dispatch:

jobs:
  destroy:
    name: Destroy Terraform Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Get DB password from Secrets Manager
        id: get_secret
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id enterprise-platform/db \
            --query SecretString \
            --output text)

          # If secret is stored as JSON: {"db_password":"value"}
          DB_PASSWORD=$(echo $SECRET | jq -r '.db_password')

          echo "TF_VAR_db_password=$DB_PASSWORD" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan Destroy
        run: terraform plan -destroy -out=destroy.tfplan -input=false

      - name: Terraform Destroy
        run: terraform apply -auto-approve destroy.tfplan

      - name: Cleanup Plan File
        run: rm -f destroy.tfplan