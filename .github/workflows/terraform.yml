name: Terraform

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options: [ plan, apply, destroy ]

env:
  AWS_REGION: eu-north-1
  TF_WORKING_DIR: terraform
  TF_STATE_BUCKET: enterprise-platform-tfstate
  TF_STATE_KEY: prod/terraform.tfstate
  TF_LOCK_TABLE: enterprise-platform-tfstate-lock

# Only one Terraform workflow runs at a time.
# cancel-in-progress: false ensures an in-flight apply is never abandoned,
# which would leave resources in a partial state and the lock held.
concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ github.event_name == 'pull_request' && 'Plan' || (github.event.inputs.action || 'Apply') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write   # needed to post plan as PR comment

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}" \
            -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        # Always run plan — on PRs it's the final step; on pushes/dispatch it previews before apply
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -lock-timeout=2m \
            -no-color \
            -out=tfplan \
            -input=false
        continue-on-error: false

      # Post plan output as a PR comment so reviewers can see the diff before merging
      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const plan = execSync('terraform show -no-color tfplan', {
              cwd: '${{ env.TF_WORKING_DIR }}'
            }).toString();

            const MAX_LENGTH = 65000;
            const truncated = plan.length > MAX_LENGTH
              ? plan.slice(0, MAX_LENGTH) + '\n... (truncated)'
              : plan;

            const body = [
              '## Terraform Plan',
              '',
              '| Step | Result |',
              '|------|--------|',
              `| Init | ${{ steps.init.outcome }} |`,
              `| Validate | ${{ steps.validate.outcome }} |`,
              `| Plan | ${{ steps.plan.outcome }} |`,
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              truncated,
              '```',
              '</details>',
              '',
              `*Triggered by @${{ github.actor }} on \`${{ github.ref_name }}\`*`,
            ].join('\n');

            // Delete previous plan comments to keep the PR clean
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              if (c.user.login === 'github-actions[bot]' && c.body.startsWith('## Terraform Plan')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # Apply only on push to main (auto-apply after merge) or explicit workflow_dispatch apply/destroy
      - name: Terraform Apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: |
          terraform apply \
            -lock-timeout=2m \
            -auto-approve \
            -input=false \
            tfplan

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          terraform destroy \
            -var-file="terraform.tfvars" \
            -lock-timeout=2m \
            -auto-approve \
            -input=false
